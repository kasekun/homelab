services:
  dockerproxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    container_name: dockerproxy
    environment:
      CONTAINERS: 1 # Allow access to viewing containers
      SERVICES: 1 # Allow access to viewing services (necessary when using Docker Swarm)
      TASKS: 1 # Allow access to viewing tasks (necessary when using Docker Swarm)
      POST: 0 # Disallow any POST operations (effectively read-only)
    ports:
      - 127.0.0.1:2375:2375
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: ${UNIVERSAL_RESTART_POLICY:-unless-stopped}
    networks:
      homepage_internal:

  homepage:
    container_name: homepage
    image: ghcr.io/gethomepage/homepage:v1.12.3 # pinned: v2.x's docker-provider client errors (`dockerStatuses ... reading 'conn'`) break label discovery and fall back to demo content
    profiles: [ "utilities", "all" ]
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      HOMEPAGE_ALLOWED_HOSTS: "www.sneets.net,sneets.net,${DOMAIN_NAME},www.${DOMAIN_NAME},${SUBDOMAIN__HOMEPAGE}.${DOMAIN_NAME}"
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${DOCKER_DIRECTORY}/appdata/homepage:/app/config
    depends_on:
      - dockerproxy
    restart: ${UNIVERSAL_RESTART_POLICY:-unless-stopped}
    networks:
      traefik:
      homepage_internal:
    labels:
      traefik.enable: true
      traefik.http.routers.homepage-rtr.rule: Host(`${DOMAIN_NAME}`) || Host(`www.${DOMAIN_NAME}`) || Host(`${SUBDOMAIN__HOMEPAGE}.${DOMAIN_NAME}`)
      traefik.http.routers.homepage-rtr.entrypoints: websecure
      traefik.http.routers.homepage-rtr.service: homepage-svc
      traefik.http.services.homepage-svc.loadbalancer.server.port: 3000
      traefik.http.routers.homepage-rtr.middlewares: chain-oauth-google@file

networks:
  homepage_internal:
    driver: bridge
