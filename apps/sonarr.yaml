#######################################
# SONARR (TV SHOW DOWNLOADS)
#######################################

services:
  sonarr:
    container_name: sonarr
    image: lscr.io/linuxserver/sonarr:latest
    profiles: ["media", "all"]
    volumes:
      - ${DOCKER_DIRECTORY}/appdata/sonarr:/config
      - ${MEDIA_DIRECTORY}/data:/data
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    security_opt:
      - no-new-privileges:true
    restart: ${UNIVERSAL_RESTART_POLICY:-unless-stopped}
    networks:
      traefik:
    labels:
      traefik.enable: true
      traefik.http.routers.sonarr-rtr.rule: Host(`${SUBDOMAIN__SONARR}.${DOMAIN_NAME}`)
      traefik.http.routers.sonarr-rtr.entrypoints: websecure
      traefik.http.routers.sonarr-rtr.service: sonarr-svc
      traefik.http.services.sonarr-svc.loadbalancer.server.port: 8989
      traefik.http.routers.sonarr-rtr.middlewares: chain-oauth-google@file

      homepage.group: Media Collectors
      homepage.name: Sonarr
      homepage.icon: sonarr.png
      homepage.href: https://sonarr.${DOMAIN_NAME}
      homepage.description: TV Series management
      homepage.weight: 0
      homepage.widget.type: sonarr
      homepage.widget.url: https://sonarr.${DOMAIN_NAME}
      homepage.widget.key: ${API_KEY__SONARR}
