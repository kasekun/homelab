#######################################
# SEERR (DOWNLOAD REQUESTS, FORMERLY OVERSEERR)
#######################################

services:
  seerr:
    container_name: seerr
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    profiles: [ "media", "all" ]
    environment:
      TZ: ${TZ}
    volumes:
      - ${DOCKER_DIRECTORY}/appdata/seerr:/app/config
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: ${UNIVERSAL_RESTART_POLICY:-unless-stopped}
    networks:
      traefik:
    labels:
      traefik.enable: true
      traefik.http.routers.seerr-rtr.rule: Host(`${SUBDOMAIN__SEERR}.${DOMAIN_NAME}`) || Host(`${SUBDOMAIN__OVERSEERR}.${DOMAIN_NAME}`)
      traefik.http.routers.seerr-rtr.entrypoints: websecure
      traefik.http.routers.seerr-rtr.service: seerr-svc
      traefik.http.services.seerr-svc.loadbalancer.server.port: 5055
      traefik.http.routers.seerr-rtr.middlewares: chain-oauth-google@file

      homepage.group: Media Collectors
      homepage.name: Seerr
      homepage.icon: seerr.png
      homepage.href: https://seerr.${DOMAIN_NAME}
      homepage.weight: 1
      homepage.widget.type: seerr
      homepage.widget.url: https://seerr.${DOMAIN_NAME}
      homepage.widget.key: ${API_KEY__SEERR}
